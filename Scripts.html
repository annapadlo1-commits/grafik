<script>
const S={boot:null,view:'dashboard',dashboard:null};
const api=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(Number(n||0));
const toast=m=>{const x=document.querySelector('#toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)};
const loading=()=>document.querySelector('#content').innerHTML='<div class="loader"><div></div><p>Analizuję dane…</p></div>';
document.addEventListener('DOMContentLoaded',init);
async function init(){try{S.boot=await api('gpBootstrap');document.querySelector('#month').value=S.boot.month;document.querySelector('#userCard').innerHTML=`<b>${esc(S.boot.user.email)}</b><br>${esc(S.boot.user.role)} • v${esc(S.boot.app.version)}`;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));await show('dashboard');}catch(e){error(e)}}
async function refresh(){return show(S.view)}
async function show(view){S.view=view;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:'Centrum dowodzenia',planner:'Generator grafiku',calendar:'Grafik miesięczny',scenarios:'Scenariusze i wersje',people:'Zespół i dostępność',budget:'Budżet i koszty',analytics:'Analizy i prognozy',mobile:'Panel pracownika',integrations:'Integracja Kadromierz',admin:'Administracja'};document.querySelector('#title').textContent=titles[view];loading();try{if(view==='dashboard')await dashboard();else if(view==='planner')planner();else if(view==='calendar')await calendar();else if(view==='scenarios')await scenarios();else if(view==='people')people();else if(view==='budget')await budget();else if(view==='analytics')await analytics();else if(view==='mobile')await mobile();else if(view==='integrations')integrations();else await admin();}catch(e){error(e)}}
async function dashboard(){const d=await api('gpDashboardData',month());S.dashboard=d;if(d.empty){document.querySelector('#content').innerHTML=`<div class="hero"><h2>Gotowi na pierwszy zaawansowany plan?</h2><p>Dane są skonfigurowane. Wygeneruj plan z regułami, preferencjami, kosztami i stand-by.</p><div class="actions"><button onclick="openGenerator()">Wygeneruj plan</button></div></div>`;return}const k=Object.fromEntries(d.kpis.map(x=>[x.METRYKA,x.WARTOŚĆ]));document.querySelector('#content').innerHTML=`<div class="grid cards">
${metric('Pokrycie obsady',(k.coverage||0)+'%','Minimalne zapotrzebowanie')}${metric('Koszt planu',money(d.selected.KOSZT),'Budżet kontrolowany')}${metric('Naruszenia',d.validation.errors.length,d.validation.errors.length?'Wymagają naprawy':'Brak błędów twardych')}${metric('Alerty',d.alerts.length,'Ryzyka i odchylenia')}</div>
<div class="grid two" style="margin-top:16px"><div class="card"><h3>Obciążenie grafiku w miesiącu</h3>${bars(d.daySeries)}</div><div class="card"><h3>Najważniejsze alerty</h3><div class="list">${d.alerts.slice(0,8).map(alert).join('')||'<p class="muted">Brak alertów.</p>'}</div></div></div>
<div class="card" style="margin-top:16px"><h3>Wykorzystanie etatów</h3>${utilTable(d.utilization.slice(0,15))}</div>`}
function metric(a,b,c){return `<div class="card metric"><small>${esc(a)}</small><strong>${esc(b)}</strong><span class="trend">${esc(c)}</span></div>`}
function bars(rows){const max=Math.max(...rows.map(x=>x.value),1);return `<div class="chart">${rows.map(x=>`<div style="height:${Math.max(4,x.value/max*100)}%" data-label="${x.date}: ${x.value}"></div>`).join('')}</div>`}
function alert(a){return `<div class="item"><span><b>${esc(a.title)}</b><br><small class="muted">${esc(a.text)}</small></span><span class="badge ${a.level==='ERROR'?'error':a.level==='WARNING'?'warn':'ok'}">${esc(a.level)}</span></div>`}
function utilTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Pracownik</th><th>Godziny</th><th>Nominał</th><th>Wykorzystanie</th><th>Zmiany</th><th>Koszt</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.hours}</td><td>${x.target}</td><td><div class="bar"><i style="width:${Math.min(100,x.utilization)}%"></i></div> ${x.utilization}%</td><td>${x.shifts}</td><td>${money(x.cost)}</td></tr>`).join('')}</tbody></table></div>`}
function planner(){document.querySelector('#content').innerHTML=`<div class="grid two"><div class="hero"><h2>Silnik planowania wielokryterialnego</h2><p>Buduje kompletny miesiąc, respektując dostępność, absencje, lokalizacje, odpoczynek, limity godzin, umiejętności i budżet.</p></div><div class="card"><h3>Nowy wariant</h3><div class="form-grid"><div class="field span2"><label>Nazwa</label><input id="pName" value="Plan operacyjny ${month()}"></div><div class="field"><label>Miesiąc</label><input id="pMonth" type="month" value="${month()}"></div><div class="field"><label>Scenariusz</label><select id="scenario"><option>BAZOWY</option><option>WYSOKI_RUCH</option><option>REDUKCJA_KOSZTÓW</option><option>BRAKI_KADROWE</option><option>SEZONOWY</option></select></div><div class="field span2"><label>Tryb optymalizacji</label><select id="mode"><option>ZRÓWNOWAŻONY</option><option>MINIMALNY_KOSZT</option><option>PREFERENCJE</option><option>RÓWNY_PODZIAŁ</option><option>MAKSYMALNE_POKRYCIE</option></select></div><div class="field span2"><label>Poziom obsady</label><select id="coverage"><option value="OPTIMAL">Optymalny</option><option value="MINIMUM">Minimalny</option></select></div></div><div class="actions"><button onclick="generate()">Generuj pełny grafik</button></div></div></div>
<div class="card" style="margin-top:16px"><h3>Co ocenia silnik</h3><div class="grid cards">${['Reguły twarde','Preferencje','Koszt i budżet','Sprawiedliwość'].map((x,i)=>metric(x,['100% blokujące','Ważone punktowo','Stawki + dodatki','Nominał i rotacja'][i],'Aktywne')).join('')}</div></div>`}
function openGenerator(){show('planner')}
async function generate(){loading();try{const r=await api('gpGeneratePlan',{name:val('pName'),month:val('pMonth'),scenario:val('scenario'),mode:val('mode'),coverage:val('coverage')});toast(`Plan gotowy w ${(r.timings.totalMs/1000).toFixed(1)} s • wynik ${r.plan.WYNIK}`);await show('dashboard')}catch(e){error(e)}}
async function calendar(){const d=await api('gpDashboardData',month());if(d.empty){document.querySelector('#content').innerHTML='<div class="empty">Brak planu dla wybranego miesiąca.</div>';return}const plan=await api('gpGetPlan',d.selected.ID),emps=Object.fromEntries(S.boot.employees.map(e=>[e.ID,e.name]));document.querySelector('#content').innerHTML=`<div class="card"><div class="item"><span><b>${esc(plan.plan.NAZWA)}</b><br><small>${esc(plan.plan.STATUS)} • ${plan.assignments.length} przydziałów</small></span><div><button class="secondary" onclick="publish('${plan.plan.ID}')">Waliduj i publikuj</button></div></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Lokalizacja</th><th>Zmiana</th><th>Pracownik</th><th>Rola</th><th>Koszt</th></tr></thead><tbody>${plan.assignments.sort((a,b)=>String(a.DATA).localeCompare(String(b.DATA))).map(a=>`<tr><td>${esc(a.DATA)}</td><td>${esc(a.LOKALIZACJA_ID)}</td><td><span class="badge ${a.STANDBY==='TAK'?'warn':''}">${esc(a.ZMIANA_ID)}</span></td><td>${esc(emps[a.PRACOWNIK_ID]||a.PRACOWNIK_ID)}</td><td>${esc(a.ROLA)}</td><td>${money(a.KOSZT)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function publish(id){try{const r=await api('gpChangePlanStatus',id,'OPUBLIKOWANY','Opublikowano z panelu');toast('Plan opublikowany');await refresh()}catch(e){error(e)}}
async function scenarios(){const plans=await api('gpListPlans',month());const cmp=plans.length?await api('gpComparePlans',plans.map(p=>p.ID)):[];document.querySelector('#content').innerHTML=`<div class="card"><h3>Porównanie wariantów</h3><div class="table-wrap"><table><thead><tr><th>Nazwa</th><th>Scenariusz</th><th>Tryb</th><th>Status</th><th>Wynik</th><th>Pokrycie</th><th>Koszt</th><th>Ryzyka</th><th></th></tr></thead><tbody>${cmp.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.scenario)}</td><td>${esc(x.mode)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.score}</td><td>${x.coverage}%</td><td>${money(x.cost)}</td><td>${x.violations+x.warnings}</td><td><button class="secondary" onclick="clonePlan('${x.id}')">Klonuj</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function clonePlan(id){await api('gpClonePlan',id,'Wariant WHAT-IF','WHAT-IF');toast('Utworzono wariant');await refresh()}
function people(){document.querySelector('#content').innerHTML=`<div class="grid two"><div class="card"><h3>Zespół demonstracyjny</h3><p class="muted">60 pracowników: pełne i częściowe etaty, rotacje, osoby tylko na rano, pracownicy jednej lokalizacji i liderzy.</p>${utilTable((S.dashboard?.utilization||[]).slice(0,20))}</div><div class="card"><h3>Zgłoś dostępność</h3><div class="form-grid"><div class="field span2"><label>Pracownik</label><select id="avEmp">${S.boot.employees.map(e=>`<option value="${e.ID}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="avDate" type="date"></div><div class="field"><label>Status</label><select id="avStatus"><option>NIEDOSTĘPNY</option><option>DOSTĘPNY</option></select></div><div class="field span2"><label>Preferencja</label><select id="avPref"><option value="">Brak</option><option>WYSOKA</option></select></div></div><div class="actions"><button onclick="saveAvailability()">Zapisz</button></div></div></div>`}
async function saveAvailability(){await api('gpSubmitAvailability',{employeeId:val('avEmp'),date:val('avDate'),status:val('avStatus'),preference:val('avPref')});toast('Dostępność zapisana')}
async function budget(){const d=await api('gpDashboardData',month());document.querySelector('#content').innerHTML=d.empty?'<div class="empty">Brak planu.</div>':`<div class="grid cards">${metric('Koszt planu',money(d.selected.KOSZT),'Z dodatkami')}${d.locationCosts.map(x=>metric(x.location,money(x.cost),'Koszt lokalizacji')).join('')}${metric('Status',d.selected.STATUS,'Kontrola publikacji')}</div><div class="card" style="margin-top:16px"><h3>Ochrona danych finansowych</h3><p>Stawki, narzuty i koszty stałe są przechowywane w chronionej warstwie. Kierownik widzi wpływ budżetu i odchylenia, ale szczegółowe dane płacowe pozostają dostępne dla administracji i księgowości.</p></div>`}
async function analytics(){const f=await api('gpForecast',Number(month().slice(0,4)));document.querySelector('#content').innerHTML=`<div class="grid two"><div class="card"><h3>Prognoza zapotrzebowania rocznego</h3>${bars(f.map(x=>({date:x.month,value:x.demandHours})))}</div><div class="card"><h3>Rekomendowany FTE</h3><div class="list">${f.map(x=>`<div class="item"><span>${x.month}</span><b>${x.recommendedFte}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><h3>Zakres analiz</h3><p class="muted">Pokrycie zmian • plan vs etat • koszt vs budżet • nadgodziny • weekendy • rotacja lokalizacji • preferencje • stand-by • absencje • sprawiedliwość • sezonowość • scenariusze kadrowe.</p></div>`}
async function mobile(){const rows=await api('gpMySchedule',month());document.querySelector('#content').innerHTML=`<div class="grid two"><div class="card"><h3>Mój grafik</h3><div class="list">${rows.map(r=>`<div class="item"><span><b>${esc(r.DATA)}</b><br><small>${esc(r.LOKALIZACJA_ID)} • ${esc(r.ZMIANA_ID)}</small></span><span class="badge ${r.STANDBY==='TAK'?'warn':'ok'}">${r.STANDBY==='TAK'?'STANDBY':'PRACA'}</span></div>`).join('')||'<p class="muted">Plan nie jest jeszcze opublikowany.</p>'}</div></div><div class="card"><h3>Wnioski pracownika</h3><p class="muted">Pracownik może zgłosić urlop, niedostępność, preferencję albo prośbę o zamianę. Kierownik dostaje kolejkę do zatwierdzenia.</p><div class="form-grid"><div class="field"><label>Od</label><input id="absFrom" type="date"></div><div class="field"><label>Do</label><input id="absTo" type="date"></div><div class="field span2"><label>Typ</label><select id="absType"><option>URLOP</option><option>CHOROBOWE</option><option>INNE</option></select></div></div><div class="actions"><button onclick="absence()">Wyślij wniosek</button></div></div></div>`}
async function absence(){await api('gpRequestAbsence',{employeeId:'P001',from:val('absFrom'),to:val('absTo'),type:val('absType')});toast('Wniosek zapisany')}
function integrations(){document.querySelector('#content').innerHTML=`<div class="grid two"><div class="card"><h3>Import nieobecności z Kadromierza</h3><p class="muted">Wklej CSV: email;od;do;typ. Import waliduje pracowników i zapisuje raport błędów.</p><textarea id="csv" rows="10" style="width:100%">email;od;do;typ\npracownik1@demo.pl;${month()}-07;${month()}-09;URLOP</textarea><div class="actions"><button onclick="importCsv()">Importuj</button></div></div><div class="card"><h3>Eksport gotowego grafiku</h3><p class="muted">Generuje CSV z pracownikiem, datą, godzinami, lokalizacją i typem zmiany.</p><div class="actions"><button onclick="exportCsv()">Eksportuj aktywny plan</button></div></div></div>`}
async function importCsv(){const lines=val('csv').trim().split(/\r?\n/),h=lines.shift().split(';'),rows=lines.map(l=>Object.fromEntries(l.split(';').map((v,i)=>[h[i],v])));const r=await api('gpImportKadromierz',rows);toast(`Import: ${r.rows.length}, błędy: ${r.errors.length}`)}
async function exportCsv(){const d=await api('gpDashboardData',month());if(d.empty)return toast('Brak planu');const r=await api('gpExportKadromierz',d.selected.ID);window.open(r.url,'_blank');toast(`Wyeksportowano ${r.rows} zmian`)}
async function admin(){const h=await api('gpHealthCheck');document.querySelector('#content').innerHTML=`<div class="grid two"><div class="card"><h3>Application Health: ${h.score}%</h3><div class="list">${h.checks.map(c=>`<div class="item"><span>${esc(c.name)}</span><span class="badge ${c.ok?'ok':'error'}">${c.ok?'PASS':'FAIL'}</span></div>`).join('')}</div></div><div class="card"><h3>Narzędzia administratora</h3><div class="actions"><button onclick="tests()">Uruchom testy</button><button class="secondary" onclick="backup()">Pełny backup</button></div><p class="muted">Dziennik audytowy, kopie, role, konfiguracja reguł i kolejka powiadomień są dostępne w warstwie administracyjnej arkusza.</p></div></div>`}
async function tests(){const r=await api('gpRunAllTests');toast(`Testy: ${r.passed}/${r.total} PASS`);await refresh()}async function backup(){const r=await api('gpCreateBackup','Kopia z panelu webowego');toast('Kopia utworzona');window.open(r.url,'_blank')}
function month(){return document.querySelector('#month').value}function val(id){return document.querySelector('#'+id)?.value||''}function error(e){document.querySelector('#content').innerHTML=`<div class="card"><h3 style="color:var(--red)">Nie udało się wykonać operacji</h3><p>${esc(e.message)}</p><button onclick="refresh()">Spróbuj ponownie</button></div>`;toast(e.message)}
</script>
