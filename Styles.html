<style>
:root{--navy:#0f172a;--blue:#2563eb;--purple:#7c3aed;--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--green:#059669;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
#app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}aside{background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);font-weight:900}.brand b,.brand small{display:block}.brand small{color:#94a3b8;margin-top:3px}
nav{display:grid;gap:4px}nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}nav button:hover,nav button.active{background:#1e293b;color:#fff}.user{margin-top:auto;border-top:1px solid #334155;padding:14px 8px 0;color:#cbd5e1;font-size:12px}
main{min-width:0}header{height:92px;background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}h1{font-size:23px;margin:0 0 4px}header p{margin:0;color:var(--muted)}.header-actions{display:flex;gap:8px;align-items:center}
button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#e2e8f0;color:#334155}button.danger{background:var(--red)}input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff}
#content{padding:24px 28px}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.5fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px #0f172a0a}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:28px;margin:8px 0}.metric .trend{font-size:12px;color:var(--green)}.card h3{margin:0 0 14px;font-size:16px}
.bar{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f1f5f9;padding:8px 0}.badge{font-size:11px;font-weight:800;border-radius:20px;padding:4px 8px;background:#dbeafe;color:#1d4ed8}.badge.warn{background:#fef3c7;color:#92400e}.badge.error{background:#fee2e2;color:#991b1b}.badge.ok{background:#d1fae5;color:#065f46}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}th{color:#475569;background:#f8fafc;position:sticky;top:0}.table-wrap{max-height:470px;overflow:auto}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#475569;font-weight:700}.span2{grid-column:span 2}.hero{padding:22px;border-radius:16px;background:linear-gradient(135deg,#172554,#4c1d95);color:white}.hero h2{margin:0 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{text-align:center;padding:50px;color:var(--muted)}
.loader{min-height:55vh;display:grid;place-content:center;text-align:center;color:var(--muted)}.loader div{width:44px;height:44px;border:4px solid #dbeafe;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}#toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:none}
.chart{height:200px;display:flex;align-items:end;gap:5px;padding-top:15px}.chart div{flex:1;background:linear-gradient(#60a5fa,#2563eb);min-width:4px;border-radius:4px 4px 0 0;position:relative}.chart div:hover:after{content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:5px;border-radius:5px;white-space:nowrap;font-size:10px}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{height:auto;position:static;padding:12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.user{display:none}.brand{padding-bottom:10px}header{height:auto;align-items:flex-start;gap:12px;padding:15px;flex-direction:column}.header-actions{width:100%;overflow:auto}#content{padding:14px}.cards,.two{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cards,.two,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}nav button{font-size:0}nav button::first-letter{font-size:18px}.metric strong{font-size:24px}}
</style>
